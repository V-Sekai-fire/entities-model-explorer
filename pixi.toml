[workspace]
name = "entities-model-explorer"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
# gh, git, perl, python are provided by the host image on CI/WSL; pixi only needs to run the script.

[tasks]
# Reproduce the Linux leg of .github/workflows/release.yml locally: fetch the engine + guest ELFs,
# export the pck, package the Linux build, and run the FDB round-trip self-test. Needs an
# authenticated `gh` (GH_TOKEN or `gh auth login`). Minutes, not the ~5+ of a CI round trip; use
# `pixi run build -- --skip-fetch` while iterating on package_desktop.sh so only the pck/package/test
# steps rerun.
build = "bash tools/local_build_test.sh"
